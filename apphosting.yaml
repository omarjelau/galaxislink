# Specifies the version of the App Hosting schema.
schemaVersion: v1alpha1

# Defines the settings for the Next.js runtime.
runtime:
  name: nextjs
  nodeVersion: 18

# Specifies the build commands to run.
build:
  command: "npm run build"

# Specifies the run commands for the server.
run:
  command: "npm run start"
